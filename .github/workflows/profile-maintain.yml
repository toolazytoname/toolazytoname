name: Weekly profile maintain

on:
  schedule:
    # Monday 09:00 China (01:00 UTC). GitHub may delay scheduled jobs by a bit.
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-maintain
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refresh recently-shipped section
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/maintain_profile.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No README changes"
            exit 0
          fi
          git commit -m "docs(profile): weekly refresh of recently shipped"
          git push
